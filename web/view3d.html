<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman 3D farm view</title>
<style>
  :root { --bg: #111714; --panel: #19221efa; --line: #34453c; --text: #edf5ef; --muted: #9fb0a5;
          --accent: #f0ae4d; --good: #67c587; --danger: #ef6d68; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 12px 16px; backdrop-filter: blur(10px); box-shadow: 0 2px 14px #0007; }
  #readout { top: 14px; left: 14px; max-width: min(46vw, 620px); }
  #readout .row { display: flex; align-items: baseline; gap: 14px; }
  #clock { font-size: clamp(30px, 3.4vw, 52px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #plan-no { font-size: clamp(16px, 1.6vw, 24px); font-weight: 700; color: var(--accent); }
  #run-state { font-size: clamp(15px, 1.3vw, 20px); color: #c3d1c8; font-weight: 600; }
  #headline { margin-top: 4px; font-size: clamp(17px, 1.7vw, 26px); font-weight: 600; line-height: 1.3; }
  #scale-note, #status { margin-top: 6px; font-size: clamp(13px, 1.05vw, 16px); color: #c3d1c8; }
  #status.error { color: var(--danger); font-weight: 700; }
  #buttons { left: 14px; bottom: 14px; display: flex; gap: 8px; padding: 8px; }
  button, a.button { font: inherit; font-size: clamp(16px, 1.4vw, 22px); color: var(--text); background: #202c26;
           border: 1px solid #465b50; border-radius: 6px; padding: 10px 18px; cursor: pointer;
           text-decoration: none; }
  button:hover, a.button:hover { border-color: var(--accent); }
  button.on { color: #17120a; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  #card { top: 14px; right: 14px; width: min(30vw, 360px); display: none; }
  #card h2 { margin: 0 0 8px; font-size: clamp(20px, 2vw, 30px); display: flex; align-items: center; gap: 10px; }
  #card .swatch { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  #card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
             font-size: clamp(14px, 1.3vw, 19px); }
  #card dt { color: #c3d1c8; }
  #card dd { margin: 0; font-weight: 600; }
  #card .close { position: absolute; top: 8px; right: 8px; padding: 4px 12px; font-size: 20px; line-height: 1; }
  .fuel { height: 12px; border-radius: 6px; background: #3b4d43; overflow: hidden; margin-top: 6px; }
  .fuel > span { display: block; height: 100%; background: var(--good); }
  .tag { padding: 4px 10px 5px; border-radius: 6px; background: #111714eb; border: 2px solid var(--line);
         font-size: clamp(15px, 1.25vw, 20px); font-weight: 700; white-space: nowrap; color: var(--text); }
  .tag .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .tag small { font-weight: 500; color: #c3d1c8; margin-left: 6px; }
  .tag.broken { background: #5a1f1ce6; border-color: var(--danger); color: #ffd9d6; }
  .tag.broken small { color: #ffc0bd; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(8, 12, 10, 0.34) 100%); }
  #brand { font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; color: #c3d1c8; letter-spacing: 0.02em;
           margin-bottom: 2px; }
  #brand b { color: var(--accent); }
  #kpis { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; padding-top: 8px;
          border-top: 1px solid var(--line); font-size: clamp(13px, 1.1vw, 17px); color: #c3d1c8; }
  #kpis b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 5px; }
  #kpis .bad b { color: var(--danger); }
  #fleet { right: 14px; bottom: 14px; width: min(26vw, 330px); padding: 10px 12px; }
  #fleet h3 { margin: 0 0 6px; font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; color: #c3d1c8; }
  .fleet-row { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 4px 10px;
               width: 100%; text-align: left; padding: 7px 8px; margin-top: 4px; border-radius: 6px;
               background: #202c26; border: 1px solid #34453c; font-size: clamp(14px, 1.2vw, 18px); }
  .fleet-row.on { border-color: var(--accent); }
  .fleet-row .dot { width: 12px; height: 12px; border-radius: 50%; }
  .fleet-row .what { color: #c3d1c8; font-size: 0.86em; }
  .fleet-row .bar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: #3b4d43; overflow: hidden; }
  .fleet-row .bar span { display: block; height: 100%; background: var(--good); }
  #scalebar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); pointer-events: none;
              text-align: center; font-size: clamp(12px, 1vw, 15px); font-weight: 700; color: #fff;
              text-shadow: 0 1px 3px #000c; }
  #scalebar div { height: 6px; margin-top: 3px; border: 2px solid #fff; border-top: none;
                  box-shadow: 0 1px 3px #0008; }
  .fieldtag { font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; padding: 2px 7px; border-radius: 5px;
              background: #111714b8; color: #fff; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="vignette"></div>

<div id="readout" class="panel">
  <div id="brand"><b>Foreman</b> <span id="farm-name"></span></div>
  <div class="row">
    <span id="clock">--:--</span>
    <span id="plan-no"></span>
    <span id="run-state"></span>
  </div>
  <div id="headline">Waiting for the farm.</div>
  <div id="kpis"></div>
  <div id="scale-note"></div>
  <div id="status"></div>
</div>

<div id="fleet" class="panel">
  <h3>Fleet</h3>
  <div id="fleet-rows"></div>
</div>

<div id="scalebar"><span id="scalebar-text"></span><div id="scalebar-line"></div></div>

<div id="card" class="panel">
  <button class="close" id="card-close" aria-label="Close">×</button>
  <h2><span class="swatch" id="card-swatch"></span><span id="card-name"></span></h2>
  <dl>
    <dt>Status</dt><dd id="card-status"></dd>
    <dt>Job</dt><dd id="card-job"></dd>
    <dt>Implement</dt><dd id="card-implement"></dd>
    <dt>Finishes</dt><dd id="card-finish"></dd>
    <dt>Fuel</dt><dd><span id="card-fuel"></span><div class="fuel"><span id="card-fuel-bar"></span></div></dd>
  </dl>
</div>

<div id="buttons" class="panel">
  <button id="btn-overview">Overview</button>
  <button id="btn-follow">Follow</button>
  <button id="btn-yard">Yard</button>
  <button id="btn-orbit">Orbit</button>
  <a class="button" href="./">Dashboard</a>
</div>

<script type="module" src="view3d.js"></script>
</body>
</html>
