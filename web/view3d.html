<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="visitor.js"></script>
<title>Foreman 3D farm view</title>
<style>
  :root { --bg: #111714; --panel: #19221efa; --line: #34453c; --text: #edf5ef; --muted: #9fb0a5;
          --accent: #f0ae4d; --good: #67c587; --danger: #ef6d68; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
           padding: 12px 16px; backdrop-filter: blur(10px); box-shadow: 0 2px 14px #0007; }
  #readout { top: 14px; left: 14px; width: min(46vw, 620px); }
  #readout .row { display: flex; align-items: baseline; gap: 14px; }
  #clock { font-size: clamp(30px, 3.4vw, 52px); font-weight: 800; font-variant-numeric: tabular-nums; }
  #run-state { font-size: clamp(15px, 1.3vw, 20px); color: #c3d1c8; font-weight: 600; }
  /* The first view: is the day on plan, does anything need me, how far along are we. */
  #verdict { margin-top: 2px; font-size: clamp(19px, 1.9vw, 30px); font-weight: 700; line-height: 1.25; }
  #attention { margin-top: 4px; font-size: clamp(15px, 1.4vw, 21px); line-height: 1.3; color: #c3d1c8; min-height: 1.3em; }
  #attention.needed { color: #ffd9d6; font-weight: 700; }
  #progress { margin-top: 10px; font-size: clamp(14px, 1.2vw, 18px); color: #c3d1c8; }
  #progress .track { height: 8px; margin-top: 5px; border-radius: 4px; background: #3b4d43; overflow: hidden; }
  #progress .track span { display: block; height: 100%; width: 0; background: #dfe7e2; }
  button.quiet { margin-top: 10px; padding: 4px 0; background: none; border: none; color: #c3d1c8;
                 font-size: clamp(13px, 1.1vw, 16px); text-decoration: underline; text-underline-offset: 3px; }
  button.quiet:hover { color: var(--text); }
  #details { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: clamp(13px, 1.1vw, 16px);
             line-height: 1.4; color: #c3d1c8; }
  #details > div { margin-bottom: 6px; }
  #details b { color: var(--text); }
  #headline { color: var(--text); font-weight: 600; }
  #scale-note, #status { margin-top: 6px; font-size: clamp(13px, 1.05vw, 16px); color: #c3d1c8; }
  #status.error { color: var(--danger); font-weight: 700; }
  #buttons { left: 14px; bottom: 14px; padding: 8px; }
  #buttons .main, #buttons .more { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #buttons .more { margin-top: 8px; }
  #buttons .more[hidden] { display: none; }
  #buttons button.quiet { margin: 0 4px; }
  #hint { margin-top: 6px; padding: 0 4px; font-size: clamp(12px, 1vw, 15px); color: #c3d1c8; }
  button, a.button { font: inherit; font-size: clamp(16px, 1.4vw, 22px); color: var(--text); background: #202c26;
           border: 1px solid #465b50; border-radius: 6px; padding: 10px 18px; cursor: pointer;
           text-decoration: none; }
  button:hover, a.button:hover { border-color: var(--accent); }
  button.on { color: #17120a; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  #card { top: 14px; right: 14px; width: min(30vw, 360px); display: none; }
  #card h2 { margin: 0 0 8px; font-size: clamp(20px, 2vw, 30px); display: flex; align-items: center; gap: 10px; }
  #card .swatch { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  #card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px;
             font-size: clamp(14px, 1.3vw, 19px); }
  #card dt { color: #c3d1c8; }
  #card dd { margin: 0; font-weight: 600; }
  #card dd.attention { color: #ffd9d6; }
  #card dd div + div { margin-top: 4px; }
  #card .close { position: absolute; top: 8px; right: 8px; padding: 4px 12px; font-size: 20px; line-height: 1; }
  .fuel { height: 12px; border-radius: 6px; background: #3b4d43; overflow: hidden; margin-top: 6px; }
  .fuel > span { display: block; height: 100%; background: #c3d1c8; }
  .tag, .fieldtag { pointer-events: auto; cursor: pointer; }
  .tag.waiting { border-style: dashed; border-color: #dfe7e2; }
  .tag { padding: 4px 10px 5px; border-radius: 6px; background: #111714eb; border: 2px solid var(--line);
         font-size: clamp(15px, 1.25vw, 20px); font-weight: 700; white-space: nowrap; color: var(--text); }
  .tag .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .tag small { font-weight: 500; color: #c3d1c8; margin-left: 6px; }
  .tag.broken { background: #5a1f1ce6; border-color: var(--danger); color: #ffd9d6; }
  .tag.broken small { color: #ffc0bd; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(8, 12, 10, 0.34) 100%); }
  /* Sits beside the readout along the top, over the sky, so it never covers the farm. */
  #incident { display: none; top: 14px; right: 14px; padding: 10px 16px; border-left: 6px solid var(--danger);
              background: #2c1817f5; font-size: clamp(14px, 1.3vw, 20px); line-height: 1.35; }
  #incident .what { font-weight: 700; color: #ffd9d6; }
  #incident .did, #incident .ai, #incident .now { margin-top: 5px; }
  #incident .ai b, #incident .did b { font-weight: 700; }
  /* The repair result: estimate beside actual, large enough to read from the back of the room. */
  #incident .repair { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid #6b3a37; gap: 10px 26px;
                      flex-wrap: wrap; align-items: baseline; }
  #incident .repair.shown { display: flex; }
  #incident .repair span { color: #c3d1c8; font-size: clamp(13px, 1.1vw, 17px); }
  #incident .repair b { display: block; color: #fff; font-size: clamp(22px, 2.3vw, 36px); font-weight: 800;
                        font-variant-numeric: tabular-nums; line-height: 1.1; }
  #brand { font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; color: #c3d1c8; letter-spacing: 0.02em;
           margin-bottom: 2px; }
  #brand b { color: var(--accent); }
  #kpis { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  #kpis b { color: var(--text); font-variant-numeric: tabular-nums; margin-left: 5px; }
  #kpis .bad b { color: var(--danger); }
  #fleet { right: 14px; bottom: 14px; width: min(26vw, 330px); padding: 10px 12px; }
  #fleet h3 { margin: 0 0 6px; font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; color: #c3d1c8; }
  .fleet-row { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 4px 10px;
               width: 100%; text-align: left; padding: 7px 8px; margin-top: 4px; border-radius: 6px;
               background: #202c26; border: 1px solid #34453c; font-size: clamp(14px, 1.2vw, 18px); }
  .fleet-row.on { background: #26352d; color: var(--text); font-weight: inherit; border-color: var(--accent);
                  box-shadow: inset 4px 0 0 var(--accent); }
  #fleet.compact .fleet-row { padding: 3px 8px; margin-top: 3px; gap: 2px 10px; font-size: clamp(13px, 1.05vw, 16px); }
  #fleet.compact .fleet-row .bar { height: 3px; }
  .fleet-row .dot { width: 12px; height: 12px; border-radius: 50%; }
  .fleet-row .what { color: #c3d1c8; font-size: 0.86em; text-align: right; }
  .fleet-row .low { grid-column: 2 / 4; color: #ffd9d6; font-size: 0.8em; font-weight: 700; }
  .fleet-row .bar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: #3b4d43; overflow: hidden; }
  .fleet-row .bar span { display: block; height: 100%; background: #c3d1c8; }
  #scalebar { position: fixed; left: 58%; bottom: 18px; transform: translateX(-50%); pointer-events: none;
              text-align: center; font-size: clamp(12px, 1vw, 15px); font-weight: 700; color: #fff;
              text-shadow: 0 1px 3px #000c; }
  #scalebar div { height: 6px; margin-top: 3px; border: 2px solid #fff; border-top: none;
                  box-shadow: 0 1px 3px #0008; }
  .fieldtag { font-size: clamp(13px, 1.05vw, 16px); font-weight: 700; padding: 2px 7px; border-radius: 5px;
              background: #111714b8; color: #fff; white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<div id="vignette"></div>

<div id="readout" class="panel">
  <div id="brand"><b>Foreman</b> <span id="farm-name"></span></div>
  <div class="row">
    <span id="clock">--:--</span>
    <span id="run-state"></span>
  </div>
  <div id="verdict">Waiting for the farm.</div>
  <div id="attention"></div>
  <div id="progress"><span id="progress-text"></span><div class="track"><span id="progress-bar"></span></div></div>
  <button id="btn-details" class="quiet" aria-expanded="false">How Foreman decided</button>
  <div id="details" hidden>
    <div id="headline"></div>
    <div id="detail-plan"></div>
    <div id="detail-safety"></div>
    <div id="detail-ai"></div>
    <div id="kpis"></div>
    <div id="scale-note"></div>
  </div>
  <div id="status"></div>
</div>

<div id="incident" class="panel">
  <div class="what" id="incident-what"></div>
  <div class="did" id="incident-did"></div>
  <div class="ai" id="incident-ai"></div>
  <div class="now" id="incident-now"></div>
  <div class="repair" id="incident-repair"></div>
</div>

<div id="fleet" class="panel">
  <h3>Tractors</h3>
  <div id="fleet-rows"></div>
</div>

<div id="scalebar"><span id="scalebar-text"></span><div id="scalebar-line"></div></div>

<div id="card" class="panel">
  <button class="close" id="card-close" aria-label="Close">×</button>
  <h2><span class="swatch" id="card-swatch"></span><span id="card-name"></span></h2>
  <dl id="card-rows"></dl>
</div>

<div id="buttons" class="panel">
  <div class="main">
    <button id="btn-overview">Whole farm</button>
    <a class="button" href="./">Dashboard</a>
    <button id="btn-more" class="quiet" aria-expanded="false">More</button>
  </div>
  <div class="more" id="more" hidden>
    <button id="btn-yard">Go to the yard</button>
    <button id="btn-orbit">Turn slowly</button>
    <button id="btn-director" title="When a tractor breaks down, the view goes to it, waits, then comes back">Show breakdowns up close</button>
  </div>
  <div id="hint">Drag to move. Scroll to zoom. Click a tractor or a field for a closer look.</div>
</div>

<script type="module" src="view3d.js"></script>
</body>
</html>
