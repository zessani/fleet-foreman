<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman</title>
<style>
  /* Colour means two things only: a tractor's own colour (from the state), and red for
     something that needs attention. Everything else is neutral, and state is said in words. */
  :root {
    color-scheme: dark;
    --bg: #0f1512;
    --panel: #18211c;
    --panel-2: #212d26;
    --line: #33443a;
    --text: #f2f7f3;
    --muted: #a9b8ae;
    --fill: #dfe7e2;       /* progress and finished work */
    --attention: #ef6d68;  /* out of service, failed, late, closed road */
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.35;
  }
  button, select { font: inherit; }
  h1 { margin: 0; font-size: 26px; }
  h2 { margin: 0 0 10px; font-size: 16px; }
  button, select {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid #4a5f54;
    border-radius: 6px;
    padding: 7px 12px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--text); }
  button.primary { color: #0f1512; background: var(--text); border-color: var(--text); font-weight: 700; }
  button:disabled, select:disabled { opacity: .38; cursor: not-allowed; }
  .muted { color: var(--muted); }
  .error { color: #ffc0bd; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }

  /* Header: the farm, the time, and the few controls that are used all the time */
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px 20px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
  }
  .clock-block { margin-left: auto; display: flex; align-items: baseline; gap: 12px; }
  .clock { font-size: 34px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .run-state { color: var(--muted); font-size: 16px; }
  .connection { display: flex; align-items: center; gap: 8px; color: var(--attention); font-weight: 650; }
  .connection[hidden] { display: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--attention); }
  .controls { display: flex; align-items: center; gap: 8px; position: relative; }
  a.button {
    color: var(--text); background: var(--panel-2); border: 1px solid #4a5f54; border-radius: 6px;
    padding: 7px 12px; text-decoration: none;
  }
  a.button:hover { border-color: var(--text); }
  /* Rarely used controls sit behind one button */
  .menu > summary {
    list-style: none; cursor: pointer; padding: 7px 12px; border: 1px solid #4a5f54;
    border-radius: 6px; background: var(--panel-2);
  }
  .menu > summary::-webkit-details-marker { display: none; }
  .menu[open] > summary { border-color: var(--text); }
  .menu-body {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: min(520px, 92vw);
    display: grid; gap: 12px; padding: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 32px #000a;
  }
  .menu-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .menu-row > label { width: 58px; color: var(--muted); }
  .menu-row select { flex: 1; min-width: 0; }
  .control-error { padding: 0 20px; color: #ffc0bd; }
  .control-error:empty { display: none; }
  .control-error:not(:empty) { padding-top: 8px; }

  /* One row that says whether the day is on plan, with three figures */
  .status {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px 28px;
    margin: 12px 20px 0;
    padding: 14px 18px;
  }
  .status.attention { border-color: var(--attention); }
  .status-main { flex: 1; min-width: 280px; }
  .status-word { font-size: 26px; font-weight: 750; line-height: 1.2; }
  .status.attention .status-word { color: var(--attention); }
  .status-last { margin-top: 4px; color: var(--muted); font-size: 16px; }
  .status-last:empty { display: none; }
  .figures { display: flex; gap: 26px; }
  .figure { display: flex; flex-direction: column; }
  .figure b { font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .figure span { color: var(--muted); font-size: 14px; }
  .figure.bad b { color: var(--attention); }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 430px;
    gap: 12px;
    padding: 12px 20px;
  }
  .map-panel { position: relative; min-height: 680px; overflow: hidden; }
  #farm-map { display: block; width: 100%; height: 100%; min-height: 680px; }
  .legend {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding: 7px 10px;
    background: #0f1512e6;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    pointer-events: none;
  }
  .key { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 50%; }
  .swatch.road { width: 18px; height: 3px; border-radius: 0; }

  /* Tabs: detail appears when someone asks for it */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
  .tabs button {
    border: 0;
    border-bottom: 3px solid transparent;
    border-radius: 0;
    background: none;
    color: var(--muted);
    padding: 8px 12px;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); font-weight: 650; }
  .tab-body { padding: 12px; }
  aside .tab-body { max-height: 700px; overflow-y: auto; }

  .list { display: grid; gap: 8px; }
  .card { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: #141c18; }
  .job-row { cursor: pointer; }
  .job-row:hover { border-color: var(--text); }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-line { margin-top: 4px; color: var(--muted); font-size: 14px; }
  .chip { font-size: 14px; white-space: nowrap; color: var(--muted); }
  .chip.attention { color: var(--attention); font-weight: 650; }
  .who { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border-radius: 50%; }
  .bar { height: 6px; margin-top: 8px; overflow: hidden; background: #2c3a32; border-radius: 3px; }
  .bar > span { display: block; height: 100%; background: var(--fill); }
  .filter-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 14px; }
  .priority-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; }
  .priority-row select { min-width: 0; }
  .event-result { min-height: 18px; margin-top: 6px; color: var(--muted); font-size: 14px; }

  .detail { margin: 0 20px 20px; padding: 0; }
  .detail > summary { padding: 12px 16px; cursor: pointer; color: var(--muted); font-size: 16px; }
  .detail[open] > summary { color: var(--text); font-weight: 650; border-bottom: 1px solid var(--line); }
  .detail .tab-body { padding: 14px; }
  .tech { display: flex; flex-wrap: wrap; gap: 8px 32px; padding: 12px 16px 4px; }
  .tech div { display: flex; align-items: baseline; gap: 8px; color: var(--muted); font-size: 14px; }
  .tech b { color: var(--text); font-size: 18px; }
  .tech b.bad { color: var(--attention); }

  @media (max-width: 1100px) {
    main { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .figures { gap: 16px; }
    .map-panel, #farm-map { min-height: 420px; }
  }
</style>
</head>
<body>
<header>
  <h1 id="farm-name">Foreman</h1>
  <div id="connection" class="connection" hidden>
    <span class="dot"></span><span id="connection-text"></span>
  </div>
  <div class="clock-block">
    <span class="clock" id="clock">--:--</span>
    <span class="run-state" id="run-state"></span>
  </div>
  <div class="controls">
    <button class="primary" data-action="start">Start</button>
    <button data-action="pause">Pause</button>
    <select id="speed" aria-label="Speed">
      <option value="1">1× speed</option>
      <option value="4" selected>4× speed</option>
      <option value="16">16× speed</option>
      <option value="60">60× speed</option>
    </select>
    <a class="button" href="view3d.html">3D view</a>
    <details class="menu" id="more-menu">
      <summary>More</summary>
      <div class="menu-body">
        <div class="menu-row">
          <label for="scenario">Farm</label>
          <select id="scenario" aria-label="Farm to load">
            <option value="sample_farm">Sample farm: 3 tractors, 10 jobs, Cedar fails at 09:30</option>
            <option value="large_farm">Large farm: Vishva's 5 tractors and 25 jobs</option>
          </select>
          <button id="random-farm">Random farm</button>
          <span id="scenario-note" hidden></span>
        </div>
        <div class="menu-row">
          <label for="break-tractor">Tractor</label>
          <select id="break-tractor" aria-label="Tractor to break"></select>
          <button id="break-button">Break down</button>
          <button id="repair-button">Repair</button>
        </div>
        <div class="menu-row">
          <label for="road-select">Road</label>
          <select id="road-select" aria-label="Road to block or open"></select>
          <button id="road-button">Close road</button>
        </div>
        <div class="menu-row">
          <button data-action="reset">Start the day again</button>
        </div>
      </div>
    </details>
  </div>
</header>
<div id="control-error" class="control-error" role="status"></div>

<section class="panel status" id="banner" aria-label="Farm status">
  <div class="status-main">
    <div class="status-word" id="status-word">Connecting to Foreman.</div>
    <div class="status-last"><span id="explanation-headline"></span> <span id="explanation-summary"></span></div>
  </div>
  <div class="figures">
    <div class="figure" id="tile-jobs"><b id="summary-jobs">–</b><span>jobs finished</span></div>
    <div class="figure" id="tile-late"><b id="summary-late">–</b><span>running late</span></div>
    <div class="figure" id="tile-down"><b id="summary-down">–</b><span>tractors broken down</span></div>
  </div>
  <button id="banner-detail">Details</button>
</section>

<main>
  <section class="panel map-panel" aria-label="Farm map">
    <canvas id="farm-map"></canvas>
    <div class="legend" id="legend"></div>
  </section>

  <aside class="panel" data-tabs="side">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="tractors" aria-selected="true">Tractors</button>
      <button role="tab" data-tab="jobs" aria-selected="false">Jobs</button>
    </div>
    <div class="tab-body" data-panel="tractors">
      <div id="tractors" class="list"><div class="muted">Waiting for tractors.</div></div>
    </div>
    <div class="tab-body" data-panel="jobs" hidden>
      <div class="filter-row">
        <label for="job-filter">Show</label>
        <select id="job-filter">
          <option value="all">All jobs</option>
          <option value="open">Not finished</option>
          <option value="trouble">Late or without a tractor</option>
        </select>
      </div>
      <div id="jobs" class="list"><div class="muted">Waiting for jobs.</div></div>
      <div class="priority-row">
        <label for="priority-job">Change priority</label>
        <select id="priority-job" aria-label="Job to reprioritize"></select>
        <select id="priority-value" aria-label="New priority">
          <option value="1">1 (low)</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
          <option value="5">5 (critical)</option>
        </select>
        <button id="priority-button">Apply</button>
      </div>
      <div id="event-result" class="event-result" role="status"></div>
    </div>
  </aside>
</main>

<details class="panel detail" data-tabs="detail" id="detail">
  <summary>How Foreman decided</summary>
  <div class="tech">
    <div><span>Safety checks</span><b id="summary-safety">–</b><span id="summary-safety-sub"></span></div>
    <div><span>Latest plan</span><b id="summary-replan">–</b><span id="summary-plan"></span></div>
    <div><span>Jobs waiting for a tractor</span><b id="summary-held">–</b></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="plan" aria-selected="true">What changed and why</button>
    <button role="tab" data-tab="compare" aria-selected="false">Compared with first come, first served</button>
    <button role="tab" data-tab="why" aria-selected="false">Why this tractor?</button>
    <button role="tab" data-tab="accuracy" aria-selected="false">Time estimates</button>
  </div>
  <div class="tab-body" data-panel="plan"><div id="decisions-panel"></div></div>
  <div class="tab-body" data-panel="compare" hidden><div id="numbers-panel"></div></div>
  <div class="tab-body" data-panel="why" hidden><div id="why-panel"></div></div>
  <div class="tab-body" data-panel="accuracy" hidden><div id="accuracy-panel"></div></div>
</details>

<script>
  const canvas = document.getElementById("farm-map");
  const ctx = canvas.getContext("2d");
  let state = null;
  let polling = false;
  let online = false;
  const displayedPositions = new Map();

  // The same six words are used on the map, in the lists and in the 3D view.
  const STATUS = { working: "Working", traveling: "On the road", servicing: "At the yard",
                   waiting: "Waiting", idle: "Free", broken: "Broken down" };
  const ATTENTION = "#ef6d68";  // the only status colour: something needs attention
  const FILL = "#dfe7e2";       // progress and finished work
  const DOING = { spray: "Spraying", mow: "Mowing", till: "Tilling", plant: "Planting" };
  const TASK = { spray: "Spray", mow: "Mow", till: "Till", plant: "Plant" };

  function text(id, value) {
    document.getElementById(id).textContent = value == null ? "" : String(value);
  }

  function element(tag, className, content) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (content != null) node.textContent = content;
    return node;
  }

  function clockAt(minute) {
    const total = Math.round((state?.farm?.day_start_min || 0) + minute);
    return `${String(Math.floor(total / 60) % 24).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
  }

  function statusWord(name) {
    return STATUS[name] || name || "Unknown";
  }

  function setConnected(connected, message) {
    online = connected;
    document.getElementById("connection").hidden = connected;  // only shown when something is wrong
    text("connection-text", message);
  }

  // ---- tabs --------------------------------------------------------------

  function selectTab(groupName, tabName) {
    const group = document.querySelector(`[data-tabs="${groupName}"]`);
    group.querySelectorAll("[data-tab]").forEach(button => {
      button.setAttribute("aria-selected", String(button.dataset.tab === tabName));
    });
    group.querySelectorAll("[data-panel]").forEach(panel => { panel.hidden = panel.dataset.panel !== tabName; });
    window.dispatchEvent(new Event("resize"));  // charts measure themselves when they become visible
  }
  document.querySelectorAll("[data-tabs]").forEach(group => {
    group.querySelectorAll("[data-tab]").forEach(button => {
      button.addEventListener("click", () => selectTab(group.dataset.tabs, button.dataset.tab));
    });
  });

  // ---- map ---------------------------------------------------------------

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const pixelWidth = Math.round(Math.max(1, canvas.clientWidth) * ratio);
    const pixelHeight = Math.round(Math.max(1, canvas.clientHeight) * ratio);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function edgeKey(a, b) {
    return [a, b].sort().join("|");
  }

  function makeTransform(farm) {
    const points = (farm.nodes || []).filter(point => Number.isFinite(point.x) && Number.isFinite(point.y));
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!points.length) return () => ({ x: width / 2, y: height / 2 });
    const xs = points.map(point => point.x);
    const ys = points.map(point => point.y);
    let minX = Math.min(...xs), maxX = Math.max(...xs);
    let minY = Math.min(...ys), maxY = Math.max(...ys);
    if (minX === maxX) { minX -= 1; maxX += 1; }
    if (minY === maxY) { minY -= 1; maxY += 1; }
    const padX = 120, padTop = 50, padBottom = 80;  // room for labels and the legend
    const scale = Math.min((width - padX * 2) / (maxX - minX), (height - padTop - padBottom) / (maxY - minY));
    const offsetX = (width - (maxX - minX) * scale) / 2;
    const offsetY = padBottom + (height - padTop - padBottom - (maxY - minY) * scale) / 2;
    return point => ({
      x: offsetX + (point.x - minX) * scale,
      y: height - offsetY - (point.y - minY) * scale,
    });
  }

  function jobsForField(jobs, fieldId) {
    return (jobs || []).filter(job => job.field === fieldId);
  }

  function currentJob(fieldJobs) {
    return fieldJobs.find(job => job.status === "active")
      || fieldJobs.find(job => job.status === "pending")
      || fieldJobs.find(job => job.status === "held")
      || fieldJobs[fieldJobs.length - 1];
  }

  function drawRoads(farm, nodes, project) {
    const blocked = new Set((farm.blocked || []).map(road => edgeKey(road[0], road[1])));
    for (const road of farm.roads || []) {
      const a = nodes.get(road[0]);
      const b = nodes.get(road[1]);
      if (!a || !b) continue;
      const pa = project(a), pb = project(b);
      const isBlocked = blocked.has(edgeKey(road[0], road[1]));
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.lineWidth = 5;
      ctx.strokeStyle = isBlocked ? ATTENTION : "#46594e";
      ctx.setLineDash(isBlocked ? [10, 7] : []);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  // The road a traveling tractor is about to drive, so the eye can follow it.
  function drawRoutes(foreman, nodes, project) {
    for (const tractor of foreman.tractors || []) {
      if (tractor.status !== "traveling") continue;
      const item = (foreman.plan || []).find(entry => entry.job === tractor.job && entry.tractor === tractor.id);
      const path = ((item && item.path) || []).map(id => nodes.get(id)).filter(Boolean);
      if (path.length < 2) continue;
      ctx.beginPath();
      path.forEach((node, index) => {
        const point = project(node);
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = tractor.color || FILL;
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 6]);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  let fieldScale = 1;  // circles shrink on a farm whose fields sit close together

  function fieldRadius(node) {
    return (16 + Math.min(12, Math.sqrt(Number(node.area_ha) || 1))) * fieldScale;
  }

  function setFieldScale(farm, project) {
    const points = (farm.nodes || []).filter(node => node.kind === "field").map(project);
    let nearest = Infinity;
    for (let i = 0; i < points.length; i++) {
      for (let j = i + 1; j < points.length; j++) {
        nearest = Math.min(nearest, Math.hypot(points[i].x - points[j].x, points[i].y - points[j].y));
      }
    }
    fieldScale = Math.max(0.5, Math.min(1, nearest / 95));
  }

  // ---- labels that keep clear of each other ---------------------------------

  function overlaps(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }

  // Try the places around a point in order and take the first that covers nothing already
  // on the map. If every place covers something, take the one that covers the least.
  function placeBox(width, height, anchor, radius, taken, order) {
    const gap = 7;
    const side = radius * 0.72;
    const spots = {
      top: { x: anchor.x - width / 2, y: anchor.y - radius - gap - height },
      bottom: { x: anchor.x - width / 2, y: anchor.y + radius + gap },
      right: { x: anchor.x + radius + gap, y: anchor.y - height / 2 },
      left: { x: anchor.x - radius - gap - width, y: anchor.y - height / 2 },
      topRight: { x: anchor.x + side + gap, y: anchor.y - side - gap - height },
      bottomRight: { x: anchor.x + side + gap, y: anchor.y + side + gap },
      topLeft: { x: anchor.x - side - gap - width, y: anchor.y - side - gap - height },
      bottomLeft: { x: anchor.x - side - gap - width, y: anchor.y + side + gap },
    };
    let best = null;
    let bestHits = Infinity;
    // Close to the point first; if every close place is taken, one step further out.
    const tries = [...order.map(name => [name, 0]), ...order.map(name => [name, 20]), ...order.map(name => [name, 42])];
    for (const [name, push] of tries) {
      const spot = spots[name];
      const dx = Math.sign(spot.x + width / 2 - anchor.x) * push * (name === "top" || name === "bottom" ? 0 : 1);
      const dy = Math.sign(spot.y + height / 2 - anchor.y) * push * (name === "left" || name === "right" ? 0 : 1);
      const box = { x: spot.x + dx, y: spot.y + dy, w: width, h: height };
      const outside = box.x < 2 || box.y < 2 || box.x + width > canvas.clientWidth - 2
        || box.y + height > canvas.clientHeight - 2;
      const hits = taken.filter(other => overlaps(box, other)).length + (outside ? 3 : 0);
      if (hits < bestHits) { best = box; bestHits = hits; }
      if (!hits) break;
    }
    taken.push(best);
    return best;
  }

  function drawLabel(box, lines) {
    ctx.fillStyle = "#141c18e6";
    ctx.fillRect(box.x, box.y, box.w, box.h);
    ctx.textAlign = "left";
    let y = box.y + 15;
    for (const line of lines) {
      ctx.font = line.font;
      ctx.fillStyle = line.color;
      ctx.fillText(line.text, box.x + 5, y);
      y += 17;
    }
  }

  function labelSize(lines) {
    let width = 0;
    for (const line of lines) {
      ctx.font = line.font;
      width = Math.max(width, ctx.measureText(line.text).width);
    }
    return { w: width + 10, h: 17 * lines.length + 5 };
  }

  function fieldLines(node, fieldJobs, workers) {
    const job = currentJob(fieldJobs);
    const lines = [{ text: node.name || node.id, font: "650 14px system-ui", color: job ? "#f2f7f3" : "#a9b8ae" }];
    if (!job) return lines;  // a field with no job today shows only its name
    const task = TASK[job.type] || job.type;
    const allDone = fieldJobs.every(item => item.status === "done");
    const progress = Math.max(0, Math.min(100, Number(job.pct) || 0));
    if (job.status === "held") lines.push({ text: `${task}: waiting for a tractor`, font: "13px system-ui", color: ATTENTION });
    else if (allDone) lines.push({ text: "Done", font: "13px system-ui", color: "#f2f7f3" });
    else {
      // The tractor working here is named on the field's own label, so it needs no label of its own.
      const who = workers.length ? ` · ${workers.join(", ")}` : "";
      lines.push({ text: `${task} ${Math.round(progress)}%${who}`, font: "13px system-ui", color: "#c3d0c7" });
    }
    return lines;
  }

  // Everything a label must not cover: the field circles, the yard and the legend.
  function fixedShapes(farm, project) {
    const taken = [];
    for (const node of farm.nodes || []) {
      const point = project(node);
      const reach = node.kind === "field" ? fieldRadius(node) + 8 : node.kind === "depot" ? 11 : 0;
      if (reach) taken.push({ x: point.x - reach, y: point.y - reach, w: reach * 2, h: reach * 2 });
    }
    const legend = document.getElementById("legend");
    taken.push({ x: legend.offsetLeft, y: legend.offsetTop, w: legend.offsetWidth, h: legend.offsetHeight });
    return taken;
  }

  const SIDES = { top: [0, -1], bottom: [0, 1], left: [-1, 0], right: [1, 0], topLeft: [-0.7, -0.7],
                  topRight: [0.7, -0.7], bottomLeft: [-0.7, 0.7], bottomRight: [0.7, 0.7] };

  // A name goes on the side that points away from the nearest other field, so it is
  // clear which circle it belongs to. Above the circle is preferred when nothing is near.
  function sidesAwayFromNeighbour(field, fields) {
    let nearest = null;
    let distance = Infinity;
    for (const other of fields) {
      if (other === field) continue;
      const d = Math.hypot(other.point.x - field.point.x, other.point.y - field.point.y);
      if (d < distance) { nearest = other; distance = d; }
    }
    const names = ["top", "bottom", "left", "right", "topLeft", "topRight", "bottomLeft", "bottomRight"];
    if (!nearest || distance > 105) return names;
    const away = [(field.point.x - nearest.point.x) / distance, (field.point.y - nearest.point.y) / distance];
    const score = name => SIDES[name][0] * away[0] + SIDES[name][1] * away[1];
    return [...names].sort((a, b) => score(b) - score(a));
  }

  // The field a tractor is working in right now, or null.
  function workingIn(tractor, foreman) {
    if (tractor.status !== "working") return null;
    const job = (foreman.jobs || []).find(item => item.id === tractor.job);
    return job ? job.field : null;
  }

  function drawNodes(farm, foreman, project, taken) {
    const fields = [];
    for (const node of farm.nodes || []) {
      const point = project(node);
      if (node.kind === "field") {
        const fieldJobs = jobsForField(foreman.jobs, node.id);
        const job = currentJob(fieldJobs);
        const progress = Math.max(0, Math.min(100, Number(job?.pct) || 0));
        const radius = fieldRadius(node);
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#1d2a23";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#5c7366";
        ctx.stroke();
        if (progress > 0) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress / 100);
          ctx.strokeStyle = FILL;
          ctx.lineWidth = 5;
          ctx.stroke();
        }
        const workers = (foreman.tractors || []).filter(tractor => workingIn(tractor, foreman) === node.id)
          .map(tractor => tractor.name || tractor.id);
        fields.push({ point, radius: radius + 7, lines: fieldLines(node, fieldJobs, workers) });
      } else if (node.kind === "depot") {
        ctx.fillStyle = "#dfe7e2";
        ctx.fillRect(point.x - 9, point.y - 9, 18, 18);
        const lines = [{ text: node.name || "Yard", font: "650 14px system-ui", color: "#f2f7f3" }];
        const size = labelSize(lines);
        drawLabel(placeBox(size.w, size.h, point, 11, taken, ["left", "bottom", "top", "bottomLeft", "topLeft", "right"]), lines);
      } else {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#6f8578";
        ctx.fill();
      }
    }
    // Names go on after every circle is drawn, each in the first free place around its field.
    // The most crowded fields choose first, because they have the fewest free places.
    const crowd = field => fields.filter(other => Math.hypot(other.point.x - field.point.x,
                                                             other.point.y - field.point.y) < 130).length;
    fields.sort((a, b) => crowd(b) - crowd(a));
    for (const field of fields) {
      const size = labelSize(field.lines);
      const box = placeBox(size.w, size.h, field.point, field.radius, taken, sidesAwayFromNeighbour(field, fields));
      drawLabel(box, field.lines);
    }
  }

  let lastFrame = 0;

  function smoothTractors(tractors) {
    // Ease by elapsed time, not by frame count, so a slow or background tab still shows
    // every tractor where the state says it is.
    const now = performance.now();
    const ease = 1 - Math.exp(-Math.min(1000, now - lastFrame) / 110);
    lastFrame = now;
    return (tractors || []).map(tractor => {
      const targetX = Number(tractor.x) || 0;
      const targetY = Number(tractor.y) || 0;
      const current = displayedPositions.get(tractor.id) || { x: targetX, y: targetY };
      current.x += (targetX - current.x) * ease;
      current.y += (targetY - current.y) * ease;
      displayedPositions.set(tractor.id, current);
      return { ...tractor, x: current.x, y: current.y };
    }).filter(tractor => Number.isFinite(tractor.x) && Number.isFinite(tractor.y));
  }

  function drawTractors(tractors, foreman, project, taken) {
    const groups = [];  // tractors standing in the same spot share one label
    for (const tractor of tractors) {
      const point = project(tractor);
      let group = groups.find(other => Math.hypot(other.x - point.x, other.y - point.y) < 18);
      if (!group) {
        group = { x: point.x, y: point.y, members: [] };
        groups.push(group);
      }
      const x = group.x + group.members.length * 20;  // fan out so every marker stays visible
      const y = group.y;
      group.members.push(tractor);
      const down = tractor.status === "broken";
      if (down) {  // a red ring, so a breakdown does not depend on the tractor's colour
        ctx.beginPath();
        ctx.arc(x, y, 19, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = ATTENTION;
        ctx.stroke();
      }
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-(Number(tractor.heading) || 0) * Math.PI / 180);
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-9, -8);
      ctx.lineTo(-5, 0);
      ctx.lineTo(-9, 8);
      ctx.closePath();
      ctx.fillStyle = tractor.color || FILL;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#0f1512";
      ctx.stroke();
      ctx.restore();
    }
    for (const group of groups) {
      // A tractor at work is already named on its field's label.
      const lines = group.members.filter(tractor => !workingIn(tractor, foreman)).map(tractor => ({
        text: `${tractor.name || tractor.id} · ${statusWord(tractor.status).toLowerCase()}`,
        font: "650 14px system-ui", color: tractor.status === "broken" ? ATTENTION : "#f2f7f3",
      }));
      if (!lines.length) continue;
      const size = labelSize(lines);
      const centre = { x: group.x + (group.members.length - 1) * 10, y: group.y };
      const box = placeBox(size.w, size.h, centre, 16 + (group.members.length - 1) * 10, taken,
        ["right", "topRight", "bottomRight", "top", "bottom", "left", "topLeft", "bottomLeft"]);
      drawLabel(box, lines);
    }
  }

  function drawMap() {
    resizeCanvas();
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#141c18";
    ctx.fillRect(0, 0, width, height);
    if (!state) {
      ctx.fillStyle = "#a9b8ae";
      ctx.font = "16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(online ? "Loading the farm." : "No farm data. Start Foreman with: python -m foreman.server", width / 2, height / 2);
      return;
    }
    const farm = state.farm || {};
    const foreman = state.foreman || {};
    const nodes = new Map((farm.nodes || []).map(node => [node.id, node]));
    const project = makeTransform(farm);
    drawRoads(farm, nodes, project);
    drawRoutes(foreman, nodes, project);
    setFieldScale(farm, project);
    const taken = fixedShapes(farm, project);
    drawNodes(farm, foreman, project, taken);
    drawTractors(smoothTractors(foreman.tractors), foreman, project, taken);
  }

  function renderLegend(foreman) {
    const tractors = foreman.tractors || [];
    const legend = document.getElementById("legend");
    const signature = tractors.map(tractor => `${tractor.name}:${tractor.color}`).join("|");
    if (legend.dataset.signature === signature) return;
    legend.dataset.signature = signature;
    legend.textContent = "";
    for (const tractor of tractors) {
      const item = element("span", "key");
      const swatch = element("span", "swatch");
      swatch.style.background = tractor.color || FILL;
      item.append(swatch, document.createTextNode(tractor.name || tractor.id));
      legend.append(item);
    }
    const ring = element("span", "key");
    const circle = element("span", "swatch");
    circle.style.background = FILL;
    ring.append(circle, document.createTextNode("Work done in a field"));
    const alert = element("span", "key");
    const red = element("span", "swatch");
    red.style.background = ATTENTION;
    alert.append(red, document.createTextNode("Needs attention"));
    const road = element("span", "key");
    const line = element("span", "swatch road");
    line.style.background = `repeating-linear-gradient(90deg, ${ATTENTION} 0 5px, transparent 5px 8px)`;
    road.append(line, document.createTextNode("Road closed"));
    legend.append(ring, alert, road);
  }

  // ---- lists -------------------------------------------------------------

  function fieldName(fieldId) {
    const node = (state?.farm?.nodes || []).find(item => item.id === fieldId);
    return (node && node.name) || fieldId;
  }

  function tractorName(tractorId) {
    const tractor = (state?.foreman?.tractors || []).find(item => item.id === tractorId);
    return (tractor && tractor.name) || tractorId;
  }

  function implementName(implementId) {
    const implement = (state?.farm?.implements || []).find(item => item.id === implementId);
    return (implement && implement.name) || implementId || "no implement";
  }

  function statusChip(label, attention) {
    return element("span", attention ? "chip attention" : "chip", label);
  }

  function tractorDot(tractorId) {
    const tractor = (state?.foreman?.tractors || []).find(item => item.id === tractorId);
    const dot = element("span", "who");
    dot.style.background = (tractor && tractor.color) || FILL;
    return dot;
  }

  function bar(pct) {
    const outer = element("div", "bar");
    const fill = element("span");
    fill.style.width = `${Math.max(0, Math.min(100, Number(pct) || 0))}%`;
    outer.append(fill);
    return outer;
  }

  function tractorDoing(tractor, job) {
    const where = job ? fieldName(job.field) : "";
    const what = job ? (DOING[job.type] || job.type) : "";
    if (tractor.status === "working" && job) return `${what} ${where}, ${Math.round(Number(job.pct) || 0)}% done`;
    if (tractor.status === "traveling" && job) return `Driving to ${where}`;
    if (tractor.status === "waiting" && job) return `Waiting at ${where}`;
    if (tractor.status === "servicing") return "Changing implement or refuelling";
    if (tractor.status === "broken") return "Stopped. Foreman has moved its work";
    return "Nothing to do right now";
  }

  function renderTractors(foreman) {
    const jobsById = new Map((foreman.jobs || []).map(job => [job.id, job]));
    const container = document.getElementById("tractors");
    container.textContent = "";
    for (const tractor of foreman.tractors || []) {
      const job = jobsById.get(tractor.job);
      const card = element("div", "card");
      const title = element("div", "card-title");
      const name = element("strong");
      name.append(tractorDot(tractor.id), document.createTextNode(tractor.name || tractor.id));
      title.append(name, statusChip(statusWord(tractor.status), tractor.status === "broken"));
      card.append(title, element("div", "card-line", tractorDoing(tractor, job)));
      const link = tractor.agopenweb
        ? ` · AgOpenWeb ${tractor.agopenweb.connected ? "connected" : "not connected"}`
        : "";
      card.append(element("div", "card-line",
        `${implementName(tractor.mounted)} · fuel ${tractor.fuel_pct ?? "?"}%${link}`));
      if (job && tractor.status === "working") card.append(bar(job.pct));
      container.append(card);
    }
    if (!(foreman.tractors || []).length) container.append(element("div", "muted", "This farm has no tractors."));
  }

  function jobState(job, planItem) {
    const late = planItem && Number(planItem.late_min) > 0.5;
    if (job.status === "done") return { label: "Done", attention: false };
    if (job.status === "held") return { label: "Waiting for a tractor", attention: true };
    if (late) return { label: `Will be ${Math.round(planItem.late_min)} min late`, attention: true };
    if (job.status === "active") return { label: "In progress", attention: false };
    return { label: "Not started", attention: false };
  }

  function renderJobs(foreman) {
    const planByJob = new Map((foreman.plan || []).map(item => [item.job, item]));
    const filter = document.getElementById("job-filter").value;
    const container = document.getElementById("jobs");
    container.textContent = "";
    let shown = 0;
    for (const job of foreman.jobs || []) {
      const planItem = planByJob.get(job.id);
      const late = job.status !== "done" && planItem && Number(planItem.late_min) > 0.5;
      if (filter === "open" && job.status === "done") continue;
      if (filter === "trouble" && !(late || job.status === "held")) continue;
      shown += 1;
      const stateNow = jobState(job, planItem);
      const row = element("div", "card job-row");
      row.dataset.job = job.id;
      const title = element("div", "card-title");
      title.append(element("strong", "", `${TASK[job.type] || job.type} ${fieldName(job.field)}`),
                   statusChip(stateNow.label, stateNow.attention));
      let line = `${job.id} · priority ${job.priority ?? "?"} · due ${clockAt(job.deadline)}`;
      if (job.status === "pending" && planItem) line += ` · starts ${clockAt(planItem.start)}`;
      const meta = element("div", "card-line", line);
      if (job.tractor) meta.append(document.createTextNode(" · "), tractorDot(job.tractor), document.createTextNode(tractorName(job.tractor)));
      row.append(title, meta);
      if (job.status === "held" && job.reason) row.append(element("div", "card-line", job.reason));
      row.append(bar(job.pct));
      container.append(row);
    }
    if (!shown) {
      container.append(element("div", "muted",
        (foreman.jobs || []).length ? "No job matches this filter." : "This farm has no jobs."));
    }
  }

  // ---- status tiles and banner ------------------------------------------

  function plural(count, one, many) {
    return `${count} ${count === 1 ? one : many}`;
  }

  // The first thing on the page: is the day on plan, and if not, what needs the farmer.
  function renderStatus(foreman) {
    const totals = foreman.totals || {};
    const jobs = foreman.jobs || [];
    const tractors = foreman.tractors || [];
    const done = totals.jobs_done ?? 0;
    const open = new Set(jobs.filter(job => job.status !== "done").map(job => job.id));
    const plannedLate = (foreman.plan || []).filter(item => open.has(item.job) && Number(item.late_min) > 0.5).length;
    const late = Math.max(0, done - (totals.on_time ?? 0)) + plannedLate;
    const held = jobs.filter(job => job.status === "held").length;
    const down = tractors.filter(tractor => tractor.status === "broken");
    const safetyFailed = foreman.safety?.passed === false;

    const needs = [];
    if (down.length) {
      const names = down.map(tractor => tractor.name || tractor.id).join(" and ");
      needs.push(`${names} ${down.length === 1 ? "is" : "are"} broken down`);
    }
    if (late) needs.push(`${plural(late, "job is", "jobs are")} running late`);
    if (held) needs.push(`${plural(held, "job is", "jobs are")} waiting for a tractor`);
    if (safetyFailed) needs.push("the latest plan failed a safety check and was not sent");

    let word = "Everything is on plan.";
    if (needs.length) word = `Needs attention: ${needs.join(", ")}.`;
    else if (state.finished) word = "The day is finished. Everything went to plan.";
    else if (!state.running && !(state.now > 0)) word = "The plan for today is ready.";
    text("status-word", word);
    document.getElementById("banner").className = `panel status ${needs.length ? "attention" : ""}`;

    // What Foreman did last, in its own words. The first plan of the day needs no note.
    const explanation = foreman.explanation || {};
    const first = (foreman.plan_no ?? 0) <= 1;
    text("explanation-headline", first ? "" : explanation.headline || "");
    const did = [];
    if (explanation.moved) did.push(`Foreman moved ${plural(explanation.moved, "job", "jobs")} to another tractor.`);
    if (!first && !late && !held) did.push("Every job is still on time.");
    text("explanation-summary", first ? "" : did.join(" "));

    const jobsValue = document.getElementById("summary-jobs");
    jobsValue.textContent = `${done} of ${jobs.length}`;
    text("summary-late", late);
    text("summary-down", down.length);
    document.getElementById("tile-late").className = `figure ${late ? "bad" : ""}`;
    document.getElementById("tile-down").className = `figure ${down.length ? "bad" : ""}`;

    // The technical numbers, one click away.
    const safety = foreman.safety || {};
    const checks = safety.checks || [];
    const safetyValue = document.getElementById("summary-safety");
    safetyValue.textContent = safety.passed == null ? "not run yet" : safety.passed ? "passed" : "failed";
    safetyValue.className = safetyFailed ? "bad" : "";
    text("summary-safety-sub", safety.passed == null ? ""
      : `${checks.filter(check => check.passed).length} of ${checks.length} checks`);
    const replanMs = explanation.ms;
    text("summary-replan", replanMs == null ? "none yet" : `made in ${Number(replanMs).toFixed(1)} ms`);
    text("summary-plan", foreman.plan_no ? `plan ${foreman.plan_no} today, with no person involved` : "");
    text("summary-held", held);
  }

  // ---- simulation controls ----------------------------------------------

  function renderRunState() {
    const thinking = state.foreman?.ai?.thinking;
    let label = state.now > 0 ? "Paused" : "Not started";
    if (state.finished) label = "Day finished";
    else if (state.running) label = thinking ? "Slowed while an AI agent answers" : "";
    text("run-state", label);
    const start = document.querySelector('button[data-action="start"]');
    const pause = document.querySelector('button[data-action="pause"]');
    start.disabled = Boolean(state.running || state.finished);
    start.title = state.finished ? "The day is over. Use More, then Start the day again." : "";
    start.textContent = state.now > 0 ? "Resume" : "Start";
    pause.disabled = !state.running;
  }

  function renderBreakdownControl() {
    const select = document.getElementById("break-tractor");
    const tractors = state?.foreman?.tractors || [];
    replaceOptions(select, tractors.map(tractor => ({
      value: tractor.id,
      label: `${tractor.name || tractor.id}${tractor.status === "broken" ? " (out of service)" : ""}`,
    })));
    const chosen = tractors.find(tractor => tractor.id === select.value);
    const broken = tractors.filter(tractor => tractor.status === "broken");
    const breakButton = document.getElementById("break-button");
    breakButton.disabled = !chosen || chosen.status === "broken" || Boolean(state?.finished);
    breakButton.title = state?.finished ? "The day is over." : "";
    const repairButton = document.getElementById("repair-button");
    repairButton.disabled = !broken.length;
    repairButton.textContent = broken.length
      ? `Repair ${broken.map(tractor => tractor.name || tractor.id).join(" and ")}` : "Repair";
  }

  function replaceOptions(select, values) {
    const selected = select.value;
    const signature = values.map(value => `${value.value}:${value.label}`).join("|");
    if (select.dataset.signature === signature) return;
    select.textContent = "";
    for (const value of values) {
      const option = document.createElement("option");
      option.value = value.value;
      option.textContent = value.label;
      select.append(option);
    }
    select.dataset.signature = signature;
    if (values.some(value => value.value === selected)) select.value = selected;
  }

  function renderEventControls() {
    const farm = state?.farm || {};
    const foreman = state?.foreman || {};
    const nodeNames = new Map((farm.nodes || []).map(node => [node.id, node.name || node.id]));
    const blocked = new Set((farm.blocked || []).map(([a, b]) => edgeKey(a, b)));
    const roadSelect = document.getElementById("road-select");
    replaceOptions(roadSelect, (farm.roads || []).map(([a, b]) => ({
      value: edgeKey(a, b),
      label: `${nodeNames.get(a) || a} to ${nodeNames.get(b) || b}${blocked.has(edgeKey(a, b)) ? " (closed)" : ""}`,
    })));
    const roadButton = document.getElementById("road-button");
    roadButton.textContent = blocked.has(roadSelect.value) ? "Open road" : "Close road";
    roadButton.disabled = !roadSelect.value;

    const jobSelect = document.getElementById("priority-job");
    const openJobs = (foreman.jobs || []).filter(job => job.status !== "done");
    replaceOptions(jobSelect, openJobs.map(job => ({
      value: job.id,
      label: `${TASK[job.type] || job.type} ${fieldName(job.field)} (priority ${job.priority})`,
    })));
    if (document.activeElement !== document.getElementById("priority-value")) {
      const job = openJobs.find(item => item.id === jobSelect.value);
      if (job) document.getElementById("priority-value").value = String(job.priority);
    }
    document.getElementById("priority-button").disabled = !jobSelect.value;
    document.getElementById("priority-value").disabled = !jobSelect.value;
  }

  function renderScenario() {
    const menu = document.getElementById("scenario");
    // A farm that is not one of the built-in entries (a random farm) gets its own line in
    // the menu, so the menu never shows a farm that is not the one on screen.
    let other = menu.querySelector("option[data-other]");
    const builtIn = [...menu.options].some(option => !option.dataset.other && option.value === state.scenario);
    if (!builtIn && !other) {
      other = document.createElement("option");
      other.dataset.other = "1";
      menu.append(other);
    }
    if (other && builtIn) other.remove();
    if (other && !builtIn) {
      other.value = state.scenario || "";
      other.textContent = state.seed != null ? `Random farm, seed ${state.seed}` : (state.farm?.name || "Other farm");
    }
    if (document.activeElement !== menu) menu.value = state.scenario || "";
    text("scenario-note", state.seed != null ? `Random farm, seed ${state.seed}` : "");
  }

  function renderState(nextState) {
    state = nextState;
    const farm = state.farm || {};
    const foreman = state.foreman || {};
    text("farm-name", (farm.name || "Foreman").replace(/\s*\(random, seed \d+\)/, ""));
    text("clock", state.clock || "--:--");
    const speed = document.getElementById("speed");
    if (state.speed != null && document.activeElement !== speed
        && [...speed.options].some(option => Number(option.value) === Number(state.speed))) {
      speed.value = String(state.speed);
    }
    renderRunState();
    renderScenario();
    renderLegend(foreman);
    renderTractors(foreman);
    renderJobs(foreman);
    renderBreakdownControl();
    renderEventControls();
    renderStatus(foreman);
  }

  function showOffline() {
    setConnected(false, "No connection");
    text("run-state", "");
    document.getElementById("banner").className = "panel status attention";
    text("status-word", state
      ? "Lost the connection to Foreman. This is the last state the page received."
      : "Cannot reach Foreman. Start it with: python -m foreman.server");
    text("explanation-headline", "");
    text("explanation-summary", "");
    document.querySelectorAll(".controls button, .controls select, .priority-row button").forEach(control => { control.disabled = true; });
  }

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const nextState = await response.json();
      if (!online) document.querySelectorAll(".controls button, .controls select").forEach(control => { control.disabled = false; });
      setConnected(true, "");
      renderState(nextState);
    } catch (error) {
      showOffline();
    } finally {
      polling = false;
    }
  }

  async function control(action) {
    text("control-error", "");
    try {
      const response = await fetch("/api/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, speed: Number(document.getElementById("speed").value) }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (result.ok === false) throw new Error(result.error || "the request was rejected");
      await poll();
    } catch (error) {
      text("control-error", `Control failed: ${error.message}`);
    }
  }

  async function breakTractor() {
    const tractor = document.getElementById("break-tractor").value;
    if (!tractor) return;
    text("control-error", "");
    try {
      const response = await fetch("/api/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "breakdown", tractor }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || "breakdown was rejected");
      if (!state?.running) text("control-error", "The tractor is down. The re-plan follows when the clock runs.");
      await poll();
    } catch (error) {
      text("control-error", `Breakdown failed: ${error.message}`);
    }
  }

  async function repairTractors() {
    const broken = (state?.foreman?.tractors || []).filter(tractor => tractor.status === "broken");
    text("control-error", "");
    try {
      for (const tractor of broken) {
        const response = await fetch("/api/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "repair", tractor: tractor.id }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
      }
      await poll();
    } catch (error) {
      text("control-error", `Repair failed: ${error.message}`);
    }
  }

  async function postEvent(payload, successMessage, resultId) {
    const resultElement = document.getElementById(resultId);
    resultElement.textContent = "";
    resultElement.classList.remove("error");
    try {
      const response = await fetch("/api/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || "event was rejected");
      resultElement.textContent = successMessage;
      await poll();
    } catch (error) {
      resultElement.classList.add("error");
      resultElement.textContent = error.message;
    }
  }

  function changeRoad() {
    const [a, b] = document.getElementById("road-select").value.split("|");
    if (!a || !b) return;
    const blocked = new Set((state?.farm?.blocked || []).map(road => edgeKey(road[0], road[1])));
    const opening = blocked.has(edgeKey(a, b));
    postEvent(
      { type: opening ? "open_road" : "block_road", a, b },
      "",
      "control-error",
    );
  }

  function changePriority() {
    const job = document.getElementById("priority-job").value;
    const priority = Number(document.getElementById("priority-value").value);
    if (!job) return;
    postEvent({ type: "set_priority", job, priority }, `${job} is now priority ${priority}.`, "event-result");
  }

  async function loadFarm(url, body) {
    text("control-error", "");
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
      displayedPositions.clear();
      await poll();
    } catch (error) {
      text("control-error", `Could not load the farm: ${error.message}`);
    }
  }

  function openDetail(tab) {
    document.getElementById("detail").open = true;
    selectTab("detail", tab);
    document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function showWhy(jobId) {
    if (!window.WhyPanel) return;
    openDetail("why");
    window.WhyPanel.show(jobId);
    document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  document.querySelectorAll("button[data-action]").forEach(button => {
    button.addEventListener("click", () => control(button.dataset.action));
  });
  document.getElementById("break-button").addEventListener("click", breakTractor);
  document.getElementById("break-tractor").addEventListener("change", renderBreakdownControl);
  document.getElementById("repair-button").addEventListener("click", repairTractors);
  document.getElementById("road-button").addEventListener("click", changeRoad);
  document.getElementById("road-select").addEventListener("change", renderEventControls);
  document.getElementById("priority-button").addEventListener("click", changePriority);
  document.getElementById("priority-job").addEventListener("change", renderEventControls);
  document.getElementById("speed").addEventListener("change", () => control(null));
  document.getElementById("scenario").addEventListener("change", event => {
    if (!event.target.selectedOptions[0]?.dataset.other) loadFarm("/api/scenario", { name: event.target.value });
  });
  document.getElementById("random-farm").addEventListener("click", () => loadFarm("/api/scenario/random", {}));
  document.getElementById("job-filter").addEventListener("change", () => { if (state) renderJobs(state.foreman || {}); });
  document.getElementById("jobs").addEventListener("click", event => {
    const row = event.target.closest(".job-row");
    if (row) showWhy(row.dataset.job);
  });
  document.getElementById("banner-detail").addEventListener("click", () => openDetail("plan"));
  document.getElementById("detail").addEventListener("toggle", () => window.dispatchEvent(new Event("resize")));
  // The More menu closes when a click lands anywhere else, or after a farm is loaded.
  document.addEventListener("click", event => {
    const menu = document.getElementById("more-menu");
    if (menu.open && !menu.contains(event.target)) menu.open = false;
  });
  new ResizeObserver(resizeCanvas).observe(canvas);

  function animate() {
    drawMap();
    requestAnimationFrame(animate);
  }

  poll();
  setInterval(poll, 500);
  requestAnimationFrame(animate);
</script>
<script src="panels/decisions.js"></script>
<script src="panels/numbers.js"></script>
<script src="panels/why.js"></script>
<script src="panels/accuracy.js"></script>
</body>
</html>
