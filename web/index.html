<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman Command Center</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111714;
    --panel: #19221e;
    --panel-2: #202c26;
    --line: #34453c;
    --text: #edf5ef;
    --muted: #9fb0a5;
    --accent: #f0ae4d;
    --good: #67c587;
    --danger: #ef6d68;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-width: 320px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  button, select { font: inherit; }
  header {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: #151d19;
  }
  h1 { margin: 0; font-size: 20px; }
  h2 { margin: 0 0 12px; font-size: 15px; }
  .subhead { margin-top: 3px; color: var(--muted); font-size: 12px; }
  .connection { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); }
  .connected .dot { background: var(--good); box-shadow: 0 0 0 3px #67c58722; }

  .controls {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
  }
  button, select {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid #465b50;
    border-radius: 6px;
    padding: 7px 12px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { color: #17120a; background: var(--accent); border-color: var(--accent); font-weight: 700; }
  button.danger { color: #ffc9c6; border-color: #8b4541; background: #442321; }
  button.danger:hover { border-color: var(--danger); }
  button:disabled { opacity: .55; cursor: wait; }
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 700; }
  .run-state { color: var(--muted); min-width: 54px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 12px;
    padding: 12px;
    min-height: calc(100vh - 117px);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .map-column { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .summary-card { padding: 10px 12px; }
  .summary-label { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .summary-value { margin-top: 3px; font-size: 18px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .summary-value.good { color: var(--good); }
  .summary-value.bad { color: var(--danger); }
  .map-panel { position: relative; min-height: 560px; overflow: hidden; }
  #farm-map { display: block; width: 100%; height: 100%; min-height: 560px; }
  .map-label {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 9px;
    color: var(--muted);
    background: #111714d9;
    border: 1px solid var(--line);
    border-radius: 5px;
    pointer-events: none;
  }
  .legend {
    position: absolute;
    left: 12px;
    bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 6px 9px;
    color: var(--muted);
    background: #111714e8;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-size: 11px;
    pointer-events: none;
  }
  .key { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; background: #6f927d; }
  .swatch.working { background: var(--good); }
  .swatch.broken { background: var(--danger); }
  .swatch.blocked { width: 16px; height: 3px; border-radius: 0; background: var(--danger); }

  aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .side-section { padding: 14px; }
  .operation { display: grid; gap: 6px; margin-top: 10px; }
  .operation:first-of-type { margin-top: 0; }
  .operation label { color: var(--muted); font-size: 11px; }
  .operation-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
  .operation-row select { min-width: 0; width: 100%; }
  .priority-row { grid-template-columns: minmax(0, 1fr) 64px auto; }
  .event-result { min-height: 16px; margin-top: 8px; color: var(--good); font-size: 11px; }
  .event-result.error { color: #ffc0bd; }
  .explanation-headline { line-height: 1.4; font-weight: 650; }
  .explanation-change { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.35; }
  .safety-line { margin-top: 9px; color: var(--good); font-size: 11px; }
  .tractor-list, .job-list { display: grid; gap: 8px; }
  .tractor-card, .job-row {
    padding: 9px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #151d19;
  }
  .tractor-title, .job-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tractor-name, .job-title strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tractor-color { width: 9px; height: 9px; display: inline-block; margin-right: 6px; border-radius: 50%; }
  .badge {
    padding: 2px 6px;
    border-radius: 10px;
    color: var(--muted);
    background: var(--panel-2);
    font-size: 10px;
    text-transform: uppercase;
  }
  .badge.working { color: #a7e8bd; background: #204b31; }
  .badge.traveling { color: #b9d9ff; background: #244466; }
  .badge.broken { color: #ffc0bd; background: #602c2a; }
  .priority { color: var(--accent); font-weight: 700; }
  .meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
  .progress { height: 5px; margin-top: 8px; overflow: hidden; background: #304037; border-radius: 3px; }
  .progress > span { display: block; height: 100%; background: var(--good); }
  .empty { color: var(--muted); font-style: italic; }
  .error { color: #ffc0bd; }
  details { padding: 12px 14px; }
  summary { cursor: pointer; color: var(--muted); }
  pre { max-height: 220px; overflow: auto; white-space: pre-wrap; font-size: 11px; color: #c9d7ce; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .map-panel, #farm-map { min-height: 480px; }
    aside { display: grid; grid-template-columns: 1fr 1fr; }
    aside details { grid-column: 1 / -1; }
  }
  @media (max-width: 580px) {
    header { align-items: flex-start; }
    .controls { padding: 10px 12px; }
    .clock { order: -1; width: 100%; margin: 0; }
    main { padding: 8px; }
    aside { display: flex; }
    .summary-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="farm-name">Foreman</h1>
    <div class="subhead">Fleet command center</div>
  </div>
  <div id="connection" class="connection">
    <span class="dot"></span><span id="connection-text">Connecting</span>
  </div>
</header>

<div class="controls">
  <button class="primary" data-action="start">Start</button>
  <button data-action="pause">Pause</button>
  <button data-action="reset">Reset</button>
  <label for="speed">Speed</label>
  <select id="speed">
    <option value="1">1×</option>
    <option value="4" selected>4×</option>
    <option value="16">16×</option>
    <option value="60">60×</option>
  </select>
  <label for="break-tractor">Tractor</label>
  <select id="break-tractor" aria-label="Tractor to break"></select>
  <button id="break-button" class="danger">Break this tractor</button>
  <button id="repair-button">Repair broken tractor</button>
  <a href="view3d.html">3D farm view</a>
  <label for="scenario">Farm</label>
  <select id="scenario" aria-label="Farm to load">
    <option value="sample_farm">Sample farm: 3 tractors, 10 jobs, Cedar fails at 09:30</option>
    <option value="large_farm">Large farm: Vishva's 5 tractors and 25 jobs</option>
  </select>
  <button id="random-farm">Random farm</button>
  <span id="scenario-note" class="subhead"></span>
  <span id="control-error" class="error"></span>
  <span class="clock" id="clock">--:--</span>
  <span class="run-state" id="run-state">Paused</span>
</div>

<main>
  <div class="map-column">
    <section class="summary-grid" aria-label="Operations summary">
      <div class="panel summary-card"><div class="summary-label">Plan</div><div id="summary-plan" class="summary-value">—</div></div>
      <div class="panel summary-card"><div class="summary-label">Safety</div><div id="summary-safety" class="summary-value">—</div></div>
      <div class="panel summary-card"><div class="summary-label">Jobs done</div><div id="summary-jobs" class="summary-value">—</div></div>
      <div class="panel summary-card"><div class="summary-label">Re-plan</div><div id="summary-replan" class="summary-value">—</div></div>
    </section>
    <section class="panel map-panel" aria-label="Farm map">
      <canvas id="farm-map"></canvas>
      <div class="map-label" id="map-label">Waiting for farm data</div>
      <div class="legend">
        <span class="key"><span class="swatch"></span>Field</span>
        <span class="key"><span class="swatch working"></span>Active</span>
        <span class="key"><span class="swatch broken"></span>Broken</span>
        <span class="key"><span class="swatch blocked"></span>Blocked road</span>
      </div>
    </section>
  </div>

  <aside>
    <section class="panel side-section">
      <h2>Live events</h2>
      <div class="operation">
        <label for="road-select">Road</label>
        <div class="operation-row">
          <select id="road-select" aria-label="Road to block or open"></select>
          <button id="road-button">Block road</button>
        </div>
      </div>
      <div class="operation">
        <label for="priority-job">Job priority</label>
        <div class="operation-row priority-row">
          <select id="priority-job" aria-label="Job to reprioritize"></select>
          <select id="priority-value" aria-label="New priority">
            <option value="1">P1</option><option value="2">P2</option>
            <option value="3">P3</option><option value="4">P4</option>
            <option value="5">P5</option>
          </select>
          <button id="priority-button">Apply</button>
        </div>
      </div>
      <div id="event-result" class="event-result" role="status"></div>
    </section>
    <section class="panel side-section">
      <h2>Tractors</h2>
      <div id="tractors" class="tractor-list"><div class="empty">No tractor data</div></div>
    </section>
    <section class="panel side-section">
      <h2>Latest plan change</h2>
      <div id="explanation-headline" class="explanation-headline empty">No plan change yet</div>
      <div id="explanation-changes"></div>
      <div id="safety-line" class="safety-line"></div>
    </section>
    <section class="panel side-section">
      <h2>Jobs</h2>
      <div id="jobs" class="job-list"><div class="empty">No job data</div></div>
    </section>
    <details class="panel">
      <summary>Raw state</summary>
      <pre id="raw-state"></pre>
    </details>
  </aside>
</main>
<div id="decisions-panel" style="margin: 0 20px 16px;"></div>
<div id="numbers-panel" style="margin: 0 20px 16px;"></div>
<div id="why-panel" style="margin: 0 20px 16px;"></div>
<div id="accuracy-panel" style="margin: 0 20px 16px;"></div>

<script>
  const canvas = document.getElementById("farm-map");
  const ctx = canvas.getContext("2d");
  let state = null;
  let polling = false;
  const displayedPositions = new Map();

  function text(id, value) {
    document.getElementById(id).textContent = value == null ? "" : String(value);
  }

  function setConnected(connected, message) {
    const element = document.getElementById("connection");
    element.classList.toggle("connected", connected);
    text("connection-text", message);
  }

  function resizeCanvas() {
    const ratio = window.devicePixelRatio || 1;
    const width = Math.max(1, canvas.clientWidth);
    const height = Math.max(1, canvas.clientHeight);
    const pixelWidth = Math.round(width * ratio);
    const pixelHeight = Math.round(height * ratio);
    if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
    }
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }

  function edgeKey(a, b) {
    return [a, b].sort().join("|");
  }

  function makeTransform(farm, tractors) {
    const points = [...(farm.nodes || []), ...(tractors || [])]
      .filter(point => Number.isFinite(point.x) && Number.isFinite(point.y));
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    if (!points.length) return () => ({ x: width / 2, y: height / 2 });

    const xs = points.map(point => point.x);
    const ys = points.map(point => point.y);
    let minX = Math.min(...xs), maxX = Math.max(...xs);
    let minY = Math.min(...ys), maxY = Math.max(...ys);
    if (minX === maxX) { minX -= 1; maxX += 1; }
    if (minY === maxY) { minY -= 1; maxY += 1; }

    const padding = 58;
    const scale = Math.min(
      (width - padding * 2) / (maxX - minX),
      (height - padding * 2) / (maxY - minY)
    );
    const usedWidth = (maxX - minX) * scale;
    const usedHeight = (maxY - minY) * scale;
    const offsetX = (width - usedWidth) / 2;
    const offsetY = (height - usedHeight) / 2;

    return point => ({
      x: offsetX + (point.x - minX) * scale,
      y: height - offsetY - (point.y - minY) * scale,
    });
  }

  function jobForField(jobs, fieldId) {
    const fieldJobs = (jobs || []).filter(job => job.field === fieldId);
    return fieldJobs.find(job => job.status === "active")
      || fieldJobs.find(job => job.status === "pending")
      || fieldJobs.find(job => job.status === "held")
      || fieldJobs[fieldJobs.length - 1];
  }

  function drawRoads(farm, nodes, project) {
    const blocked = new Set((farm.blocked || []).map(road => edgeKey(road[0], road[1])));
    for (const road of farm.roads || []) {
      const a = nodes.get(road[0]);
      const b = nodes.get(road[1]);
      if (!a || !b) continue;
      const pa = project(a), pb = project(b);
      const isBlocked = blocked.has(edgeKey(road[0], road[1]));
      ctx.beginPath();
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
      ctx.lineWidth = isBlocked ? 4 : 5;
      ctx.strokeStyle = isBlocked ? "#ef6d68" : "#3c5146";
      ctx.setLineDash(isBlocked ? [8, 6] : []);
      ctx.stroke();
      if (!isBlocked) {
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#8ca19455";
        ctx.stroke();
      }
    }
    ctx.setLineDash([]);
  }

  function drawPlannedRoutes(foreman, nodes, project) {
    const tractors = new Map((foreman.tractors || []).map(tractor => [tractor.id, tractor]));
    for (const item of foreman.plan || []) {
      const tractor = tractors.get(item.tractor);
      const path = (item.path || []).map(id => nodes.get(id)).filter(Boolean);
      if (!tractor || path.length < 2) continue;
      ctx.beginPath();
      path.forEach((node, index) => {
        const point = project(node);
        if (index === 0) ctx.moveTo(point.x, point.y);
        else ctx.lineTo(point.x, point.y);
      });
      ctx.strokeStyle = (tractor.color || "#ffffff") + "55";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 5]);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function drawNodes(farm, foreman, nodes, project) {
    for (const node of farm.nodes || []) {
      const point = project(node);
      if (node.kind === "field") {
        const job = jobForField(foreman.jobs, node.id);
        const progress = Math.max(0, Math.min(100, Number(job?.pct) || 0));
        const radius = 15 + Math.min(10, Math.sqrt(Number(node.area_ha) || 1));
        ctx.beginPath();
        ctx.arc(point.x, point.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = job?.status === "active" ? "#254b34" : "#27372f";
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#6f927d";
        ctx.stroke();

        if (progress > 0) {
          ctx.beginPath();
          ctx.arc(point.x, point.y, radius + 5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * progress / 100);
          ctx.strokeStyle = progress >= 100 ? "#67c587" : "#f0ae4d";
          ctx.lineWidth = 4;
          ctx.stroke();
        }
        ctx.fillStyle = "#edf5ef";
        ctx.font = "600 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(node.name || node.id, point.x, point.y - radius - 10);
        ctx.fillStyle = "#b5c5bb";
        ctx.font = "10px system-ui";
        ctx.fillText(job ? `${job.type} ${progress}%` : `${node.area_ha || "?"} ha`, point.x, point.y + 4);
      } else if (node.kind === "depot") {
        ctx.fillStyle = "#f0ae4d";
        ctx.fillRect(point.x - 8, point.y - 8, 16, 16);
        ctx.fillStyle = "#edf5ef";
        ctx.font = "600 11px system-ui";
        ctx.textAlign = "center";
        ctx.fillText(node.name || "Yard", point.x, point.y - 15);
      } else {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#8ca194";
        ctx.fill();
      }
    }
  }

  function smoothTractors(tractors) {
    const currentIds = new Set();
    return (tractors || []).map(tractor => {
      currentIds.add(tractor.id);
      const targetX = Number(tractor.x) || 0;
      const targetY = Number(tractor.y) || 0;
      const current = displayedPositions.get(tractor.id) || { x: targetX, y: targetY };
      current.x += (targetX - current.x) * 0.14;
      current.y += (targetY - current.y) * 0.14;
      displayedPositions.set(tractor.id, current);
      return { ...tractor, x: current.x, y: current.y };
    }).filter(tractor => Number.isFinite(tractor.x) && Number.isFinite(tractor.y));
  }

  function drawTractors(tractors, project) {
    for (const tractor of tractors) {
      const point = project(tractor);
      const heading = Number(tractor.heading) || 0;
      const color = tractor.status === "broken" ? "#ef6d68" : (tractor.color || "#ffffff");
      ctx.save();
      ctx.translate(point.x, point.y);
      ctx.rotate(heading * Math.PI / 180);
      ctx.beginPath();
      ctx.moveTo(13, 0);
      ctx.lineTo(-9, -8);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-9, 8);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#101512";
      ctx.stroke();
      ctx.restore();

      ctx.font = "600 11px system-ui";
      ctx.textAlign = "left";
      const label = `${tractor.name || tractor.id} · ${tractor.status || "unknown"}`;
      const labelWidth = ctx.measureText(label).width + 12;
      ctx.fillStyle = "#111714dd";
      ctx.fillRect(point.x + 12, point.y - 22, labelWidth, 18);
      ctx.fillStyle = "#edf5ef";
      ctx.fillText(label, point.x + 18, point.y - 9);
    }
  }

  function drawMap() {
    resizeCanvas();
    const width = canvas.clientWidth;
    const height = canvas.clientHeight;
    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = "#18231d";
    ctx.fillRect(0, 0, width, height);

    ctx.strokeStyle = "#233129";
    ctx.lineWidth = 1;
    for (let x = 24; x < width; x += 36) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
    }
    for (let y = 24; y < height; y += 36) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
    }

    if (!state) {
      ctx.fillStyle = "#9fb0a5";
      ctx.font = "14px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("Waiting for farm state…", width / 2, height / 2);
      return;
    }

    const farm = state.farm || {};
    const foreman = state.foreman || {};
    const tractors = smoothTractors(foreman.tractors);
    const nodes = new Map((farm.nodes || []).map(node => [node.id, node]));
    const project = makeTransform(farm, tractors);
    drawRoads(farm, nodes, project);
    drawPlannedRoutes(foreman, nodes, project);
    drawNodes(farm, foreman, nodes, project);
    drawTractors(tractors, project);
  }

  function renderLists() {
    if (!state) return;
    const foreman = state.foreman || {};
    const jobsById = new Map((foreman.jobs || []).map(job => [job.id, job]));
    const tractorContainer = document.getElementById("tractors");
    tractorContainer.textContent = "";
    for (const tractor of foreman.tractors || []) {
      const job = jobsById.get(tractor.job);
      const card = document.createElement("div");
      card.className = "tractor-card";
      const title = document.createElement("div");
      title.className = "tractor-title";
      const name = document.createElement("strong");
      name.className = "tractor-name";
      const color = document.createElement("span");
      color.className = "tractor-color";
      color.style.background = tractor.color || "#ffffff";
      name.append(color, document.createTextNode(tractor.name || tractor.id));
      const badge = document.createElement("span");
      badge.className = `badge ${tractor.status || ""}`;
      badge.textContent = tractor.status || "unknown";
      title.append(name, badge);
      const meta = document.createElement("div");
      meta.className = "meta";
      const source = tractor.agopenweb
        ? `AgOpenWeb ${tractor.agopenweb.connected ? "connected" : "offline"} · ${tractor.speed_kph ?? 0} km/h`
        : "SimTractor";
      meta.textContent = `${tractor.job || "No job"} · ${tractor.mounted || "No implement"} · Fuel ${tractor.fuel_pct ?? "?"}% · ${source}`;
      card.append(title, meta);
      if (job) {
        const progress = document.createElement("div");
        progress.className = "progress";
        const fill = document.createElement("span");
        fill.style.width = `${Math.max(0, Math.min(100, Number(job.pct) || 0))}%`;
        progress.append(fill);
        card.append(progress);
      }
      tractorContainer.append(card);
    }
    if (!(foreman.tractors || []).length) tractorContainer.innerHTML = '<div class="empty">No tractor data</div>';

    const jobContainer = document.getElementById("jobs");
    jobContainer.textContent = "";
    for (const job of foreman.jobs || []) {
      const row = document.createElement("div");
      row.className = "job-row";
      const title = document.createElement("div");
      title.className = "job-title";
      const name = document.createElement("strong");
      name.textContent = `${job.id} · ${job.type}`;
      const pct = document.createElement("span");
      pct.textContent = `${Math.round(Number(job.pct) || 0)}%`;
      title.append(name, pct);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.append(document.createTextNode(
        `${job.field} · ${job.status || "unknown"} · ${job.tractor || "unassigned"} · `
      ));
      const priority = document.createElement("span");
      priority.className = "priority";
      priority.textContent = `P${job.priority ?? "?"}`;
      meta.append(priority);
      const progress = document.createElement("div");
      progress.className = "progress";
      const fill = document.createElement("span");
      fill.style.width = `${Math.max(0, Math.min(100, Number(job.pct) || 0))}%`;
      progress.append(fill);
      row.append(title, meta, progress);
      jobContainer.append(row);
    }
    if (!(foreman.jobs || []).length) jobContainer.innerHTML = '<div class="empty">No job data</div>';
  }

  function renderBreakdownControl() {
    const select = document.getElementById("break-tractor");
    const button = document.getElementById("break-button");
    const tractors = state?.foreman?.tractors || [];
    const selected = select.value;
    select.textContent = "";
    for (const tractor of tractors) {
      const option = document.createElement("option");
      option.value = tractor.id;
      option.textContent = `${tractor.name || tractor.id} (${tractor.status || "unknown"})`;
      option.disabled = tractor.status === "broken";
      select.append(option);
    }
    const preferred = tractors.find(tractor => tractor.id === selected && tractor.status !== "broken")
      || tractors.find(tractor => tractor.status !== "broken");
    if (preferred) select.value = preferred.id;
    button.disabled = !preferred;
  }

  function replaceOptions(select, values) {
    const selected = select.value;
    const signature = values.map(value => `${value.value}:${value.label}`).join("|");
    if (select.dataset.signature === signature) return;
    select.textContent = "";
    for (const value of values) {
      const option = document.createElement("option");
      option.value = value.value;
      option.textContent = value.label;
      select.append(option);
    }
    select.dataset.signature = signature;
    if (values.some(value => value.value === selected)) select.value = selected;
  }

  function renderEventControls() {
    const farm = state?.farm || {};
    const foreman = state?.foreman || {};
    const nodeNames = new Map((farm.nodes || []).map(node => [node.id, node.name || node.id]));
    const roadSelect = document.getElementById("road-select");
    replaceOptions(roadSelect, (farm.roads || []).map(([a, b]) => ({
      value: edgeKey(a, b),
      label: `${nodeNames.get(a) || a} ↔ ${nodeNames.get(b) || b}`,
    })));
    const blocked = new Set((farm.blocked || []).map(([a, b]) => edgeKey(a, b)));
    const selectedRoadBlocked = blocked.has(roadSelect.value);
    const roadButton = document.getElementById("road-button");
    roadButton.textContent = selectedRoadBlocked ? "Open road" : "Block road";
    roadButton.classList.toggle("danger", !selectedRoadBlocked);
    roadButton.disabled = !roadSelect.value;

    const jobSelect = document.getElementById("priority-job");
    replaceOptions(jobSelect, (foreman.jobs || []).map(job => ({
      value: job.id,
      label: `${job.id} · ${job.type} · P${job.priority}`,
    })));
    if (document.activeElement !== document.getElementById("priority-value")) {
      const job = (foreman.jobs || []).find(item => item.id === jobSelect.value);
      if (job) document.getElementById("priority-value").value = String(job.priority);
    }
    document.getElementById("priority-button").disabled = !jobSelect.value;
  }

  function renderExplanation() {
    const foreman = state?.foreman || {};
    const explanation = foreman.explanation || {};
    const headline = document.getElementById("explanation-headline");
    headline.textContent = explanation.headline || "No plan change yet";
    headline.classList.toggle("empty", !explanation.headline);
    const changes = document.getElementById("explanation-changes");
    changes.textContent = "";
    for (const message of explanation.changes || []) {
      const line = document.createElement("div");
      line.className = "explanation-change";
      line.textContent = message;
      changes.append(line);
    }
    text("safety-line", explanation.safety || "");
  }

  function renderSummary() {
    const foreman = state?.foreman || {};
    const totals = foreman.totals || {};
    const safety = foreman.safety || {};
    text("summary-plan", `#${foreman.plan_no ?? "—"}`);
    text("summary-safety", safety.passed == null ? "Pending" : safety.passed ? "Passed" : "Failed");
    document.getElementById("summary-safety").className =
      `summary-value ${safety.passed ? "good" : safety.passed === false ? "bad" : ""}`;
    text("summary-jobs", `${totals.jobs_done ?? 0}/${(foreman.jobs || []).length}`);
    const replanMs = foreman.explanation?.ms;
    text("summary-replan", replanMs == null ? "—" : `${Number(replanMs).toFixed(1)} ms`);
  }

  function renderState(nextState) {
    state = nextState;
    const farm = state.farm || {};
    text("farm-name", farm.name || "Foreman");
    text("clock", state.clock || "--:--");
    text("run-state", state.running ? "Running" : "Paused");
    text("map-label", `${(farm.nodes || []).filter(node => node.kind === "field").length} fields · ${(state.foreman?.tractors || []).length} tractors · ${(farm.blocked || []).length} blocked`);
    text("raw-state", JSON.stringify(state, null, 2));
    const speed = document.getElementById("speed");
    if (state.speed != null && [...speed.options].some(option => Number(option.value) === Number(state.speed))) {
      speed.value = String(state.speed);
    }
    renderLists();
    renderBreakdownControl();
    renderEventControls();
    renderExplanation();
    renderSummary();
  }

  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const nextState = await response.json();
      renderState(nextState);
      setConnected(true, nextState.execution === "agopenweb" ? "Live · AgOpenWeb" : "Live · Simulator");
    } catch (error) {
      setConnected(false, "Server unavailable");
    } finally {
      polling = false;
    }
  }

  async function control(action) {
    const buttons = document.querySelectorAll("button[data-action]");
    buttons.forEach(button => { button.disabled = true; });
    text("control-error", "");
    try {
      const response = await fetch("/api/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, speed: Number(document.getElementById("speed").value) }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (result.ok === false) throw new Error(result.error || "the request was rejected");
      await poll();
    } catch (error) {
      text("control-error", `Control failed: ${error.message}`);
    } finally {
      buttons.forEach(button => { button.disabled = false; });
    }
  }

  async function breakTractor() {
    const button = document.getElementById("break-button");
    const tractor = document.getElementById("break-tractor").value;
    if (!tractor) return;
    button.disabled = true;
    text("control-error", "");
    try {
      const response = await fetch("/api/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type: "breakdown", tractor }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || "breakdown was rejected");
      await poll();
    } catch (error) {
      text("control-error", `Breakdown failed: ${error.message}`);
    } finally {
      renderBreakdownControl();
    }
  }

  async function repairTractors() {
    const broken = (state?.foreman?.tractors || []).filter(tractor => tractor.status === "broken");
    text("control-error", broken.length ? "" : "No tractor is broken.");
    try {
      for (const tractor of broken) {
        const response = await fetch("/api/event", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "repair", tractor: tractor.id }),
        });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
      }
      await poll();
    } catch (error) {
      text("control-error", `Repair failed: ${error.message}`);
    }
  }

  async function postEvent(payload, successMessage) {
    const resultElement = document.getElementById("event-result");
    resultElement.textContent = "";
    resultElement.classList.remove("error");
    try {
      const response = await fetch("/api/event", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || "event was rejected");
      resultElement.textContent = successMessage;
      await poll();
    } catch (error) {
      resultElement.classList.add("error");
      resultElement.textContent = error.message;
    }
  }

  function changeRoad() {
    const [a, b] = document.getElementById("road-select").value.split("|");
    if (!a || !b) return;
    const blocked = new Set((state?.farm?.blocked || []).map(road => edgeKey(road[0], road[1])));
    const opening = blocked.has(edgeKey(a, b));
    postEvent(
      { type: opening ? "open_road" : "block_road", a, b },
      opening ? `Road ${a}–${b} reopened` : `Road ${a}–${b} blocked and plan recalculated`,
    );
  }

  function changePriority() {
    const job = document.getElementById("priority-job").value;
    const priority = Number(document.getElementById("priority-value").value);
    if (!job) return;
    postEvent({ type: "set_priority", job, priority }, `${job} changed to priority ${priority}`);
  }

  document.querySelectorAll("button[data-action]").forEach(button => {
    button.addEventListener("click", () => control(button.dataset.action));
  });
  document.getElementById("break-button").addEventListener("click", breakTractor);
  document.getElementById("repair-button").addEventListener("click", repairTractors);
  document.getElementById("road-button").addEventListener("click", changeRoad);
  document.getElementById("road-select").addEventListener("change", renderEventControls);
  document.getElementById("priority-button").addEventListener("click", changePriority);
  document.getElementById("priority-job").addEventListener("change", renderEventControls);
  document.getElementById("speed").addEventListener("change", () => control(null));
  new ResizeObserver(resizeCanvas).observe(canvas);
  window.addEventListener("resize", resizeCanvas);

  function animate() {
    drawMap();
    requestAnimationFrame(animate);
  }

  async function loadFarm(url, body) {
    text("control-error", "");
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const result = await response.json();
      if (!response.ok || !result.ok) throw new Error(result.error || `HTTP ${response.status}`);
      await poll();
    } catch (error) {
      text("control-error", `Could not load the farm: ${error.message}`);
    }
  }
  document.getElementById("scenario").addEventListener("change", event => loadFarm("/api/scenario", { name: event.target.value }));
  document.getElementById("random-farm").addEventListener("click", () => loadFarm("/api/scenario/random", {}));
  setInterval(() => {
    if (!state) return;
    const menu = document.getElementById("scenario");
    const index = [...menu.options].findIndex(option => option.value === state.scenario);
    if (document.activeElement !== menu) menu.selectedIndex = index;
    text("scenario-note", state.seed != null ? `Random farm, seed ${state.seed}` : "");
  }, 500);
  document.getElementById("jobs").style.cursor = "pointer";
  document.getElementById("jobs").addEventListener("click", event => {
    const row = event.target.closest(".job-row");
    const name = row && row.querySelector("strong");
    if (!name || !window.WhyPanel) return;
    window.WhyPanel.show(name.textContent.split(" · ")[0]);
    document.getElementById("why-panel").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  poll();
  setInterval(poll, 500);
  requestAnimationFrame(animate);
</script>
<script src="panels/decisions.js"></script>
<script src="panels/numbers.js"></script>
<script src="panels/why.js"></script>
<script src="panels/accuracy.js"></script>
