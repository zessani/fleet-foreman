<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman placeholder</title>
<style>
  body {
    margin: 0;
    padding: 16px;
    background: #ffffff;
    color: #1a1a1a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  h2 { font-size: 16px; margin: 20px 0 8px; }
  .note { background: #fff4d6; border: 1px solid #e8c766; padding: 8px; border-radius: 4px; }
  .status { color: #555; margin: 4px 0; }
  .error { color: #b00020; font-weight: bold; }
  table { border-collapse: collapse; width: 100%; overflow-x: auto; display: block; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; white-space: nowrap; }
  th { background: #f2f2f2; }
  details { margin-top: 20px; }
  pre { background: #f7f7f7; padding: 8px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="note">Placeholder page. Ahmed replaces this with the dashboard.</div>

<h1 id="farm">Farm: ...</h1>
<p class="status">Clock: <span id="clock">--:--</span> | Running: <span id="running">no</span></p>
<p id="connection" class="status"></p>

<h2>Foreman tractors</h2>
<table>
  <thead><tr><th>Name</th><th>Status</th><th>Job</th><th>Fuel %</th><th>Mounted</th></tr></thead>
  <tbody id="tractors"></tbody>
</table>

<h2>Foreman jobs</h2>
<table>
  <thead><tr><th>ID</th><th>Type</th><th>Field</th><th>Priority</th><th>Deadline</th><th>Pct</th><th>Status</th><th>Tractor</th></tr></thead>
  <tbody id="jobs"></tbody>
</table>

<h2>Explanation</h2>
<p><strong id="headline"></strong></p>
<p id="summary"></p>

<details>
  <summary>Raw state JSON</summary>
  <pre id="raw"></pre>
</details>

<script>
  function setText(id, value) {
    document.getElementById(id).textContent = value == null ? "" : String(value);
  }

  function fillTable(bodyId, rows, columns) {
    const body = document.getElementById(bodyId);
    body.textContent = "";
    (rows || []).forEach(function (row) {
      const tr = document.createElement("tr");
      columns.forEach(function (col) {
        const td = document.createElement("td");
        td.textContent = row[col] == null ? "" : String(row[col]);
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  function render(state) {
    const farm = state.farm || {};
    const foreman = state.foreman || {};
    const explanation = foreman.explanation || {};
    setText("farm", "Farm: " + (farm.name || "(none)"));
    setText("clock", state.clock);
    setText("running", state.running ? "yes" : "no");
    fillTable("tractors", foreman.tractors, ["name", "status", "job", "fuel_pct", "mounted"]);
    fillTable("jobs", foreman.jobs, ["id", "type", "field", "priority", "deadline", "pct", "status", "tractor"]);
    setText("headline", explanation.headline);
    setText("summary", explanation.summary);
    setText("raw", JSON.stringify(state, null, 2));
  }

  async function poll() {
    try {
      const response = await fetch("/api/state");
      if (!response.ok) throw new Error("HTTP " + response.status);
      const state = await response.json();
      setText("connection", "");
      render(state);
    } catch (err) {
      setText("connection", "Server not reachable");
      document.getElementById("connection").className = "status error";
    }
  }

  poll();
  setInterval(poll, 500);
</script>
</body>
</html>
